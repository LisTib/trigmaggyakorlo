<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Háromszöggyakorló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #f2f6fc; --grid: #cfdcee; --sheet: #fbfdff; --ink: #17264a; --ink-soft: #4d5c80;
  --pen: #2245c4; --pen-soft: #dfe7fb; --red: #c93434; --red-soft: #fbe4e4;
  --green: #1c7d54; --green-soft: #ddf3e8; --line: #b9c8df;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1730; --grid: #1c2849; --sheet: #162040; --ink: #e7edfb; --ink-soft: #9aa9ce;
    --pen: #86a2ff; --pen-soft: #22305e; --red: #ff8a8a; --red-soft: #4a2230;
    --green: #67d8a5; --green-soft: #17403a; --line: #2d3c68; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 4px 0 0; color: var(--ink-soft); }
.tally { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--sheet); border: 1px solid var(--line); padding: 6px 12px; min-width: 104px; }
.chip small { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.chip b { font-family: var(--f-mono); font-weight: 500; font-size: 1.15rem; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.topics { display: grid; gap: 8px; }
.topic {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer;
  background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px;
}
.topic:hover { border-color: var(--pen); }
.topic:focus-visible, .lv:focus-visible, .btn:focus-visible, .key:focus-visible, .ts:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.topic[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); box-shadow: 3px 3px 0 var(--pen); }
.topic .nm { font-weight: 600; }
.topic .fm { grid-column: 1 / -1; font-family: var(--f-math); font-size: 1.05rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topic .sc { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
@media (max-width: 860px) { .topics { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }

.work { display: grid; gap: 16px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg > span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-right: 4px; }
.lv { font: inherit; cursor: pointer; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); padding: 5px 14px; }
.lv[aria-checked="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.sheet { background: var(--sheet); border: 1px solid var(--ink); box-shadow: 5px 5px 0 var(--line); padding: 22px clamp(14px, 4vw, 30px) 20px; min-width: 0; }
.kind { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 2px; }
.ask { margin: 0 0 10px; font-weight: 500; }
i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.45; margin: 0 .12em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .25em; }
.frac > span:last-child { padding: 0 .25em; }
.ov { border-top: 1.5px solid currentColor; padding: 0 .1em; margin-left: .05em; }

/* Feladat: ábra + adatok */
.task { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px 22px; align-items: center; }
@media (max-width: 620px) { .task { grid-template-columns: minmax(0, 1fr); } }
.fig { background: var(--paper); border: 1px solid var(--line); }
.fig svg { display: block; width: 100%; height: auto; }
.fig .tri { fill: var(--pen-soft); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.fig .sd { stroke-width: 3.2; stroke-linecap: round; fill: none; }
.fig .arc { fill: none; stroke-width: 1.6; }
.fig .vx { fill: var(--ink); font-family: var(--f-body); font-weight: 600; font-size: 15px; }
.fig .lb { font-family: var(--f-math); font-size: 15px; }
.fig .s-given { stroke: var(--pen); fill: var(--pen); }
.fig .s-target { stroke: var(--red); fill: var(--red); }
.fig .s-calc { stroke: var(--green); fill: var(--green); }
.fig .s-other { stroke: var(--ink-soft); fill: var(--ink-soft); }
.fig text.lb { stroke: none; paint-order: stroke; }
.fig text.lb.halo { stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.data h3, .part h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; font-family: var(--f-body); }
.data ul { list-style: none; margin: 0 0 8px; padding: 0; font-family: var(--f-math); font-size: 1.25rem; line-height: 1.7; }
.data li.given { color: var(--pen); }
.data li.calc { color: var(--green); }
.data li.target { color: var(--red); }
.data li small { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); margin-left: 6px; }

/* Részek */
.part { border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 14px; }
.part[hidden] { display: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tpl { font-family: var(--f-math); font-size: clamp(1.25rem, 5vw, 1.9rem); line-height: 2.1; overflow-x: auto; white-space: nowrap; padding: 4px 2px; }
.tpl:empty::before { content: "Válaszd ki, melyik tételt írod fel."; font-family: var(--f-body); font-size: 14px; color: var(--ink-soft); white-space: normal; }
.ts {
  font: inherit; font-size: .9em; color: var(--pen); cursor: pointer; min-width: 1.9em; height: 1.55em; padding: 0 .25em; margin: .08em .06em;
  background: var(--sheet); border: 1.5px dashed var(--line); border-radius: 0; vertical-align: middle; line-height: 1;
}
.ts.f { border-style: solid; border-color: var(--pen); background: var(--pen-soft); }
.ts.act { outline: 2px solid var(--pen); outline-offset: 1px; border-color: var(--pen); }
.ts:disabled { cursor: default; color: var(--ink); background: transparent; border: 0; min-width: 0; padding: 0; margin: 0; height: auto; }
[hidden] { display: none !important; }
.tpl.ok .ts { color: var(--green); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.key { font-family: var(--f-math); font-size: 1.15rem; min-width: 44px; height: 40px; padding: 0 10px; cursor: pointer; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); }
.key:hover { border-color: var(--pen); }
.key[aria-pressed="true"] { background: var(--pen); color: var(--paper); border-color: var(--pen); }
.key.txt { font-family: var(--f-body); font-size: .9rem; font-weight: 500; }
.key:disabled { opacity: .45; cursor: default; }
.grp { display: grid; gap: 8px; margin-top: 10px; }
.grp > label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { font: inherit; font-weight: 600; cursor: pointer; padding: 9px 18px; border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--paper); }
.btn.sm { padding: 6px 12px; font-weight: 500; }
.btn:hover { filter: brightness(1.06); }
.btn[hidden] { display: none; }

.fb { margin-top: 10px; min-height: 1.5em; font-weight: 600; }
.fb.ok { color: var(--green); }
.fb.bad { color: var(--red); }
.fb.info { color: var(--ink-soft); font-weight: 500; }
.fb .m { font-family: var(--f-math); font-size: 1.1em; color: var(--pen); }

.scroll { overflow-x: auto; }
.rows { display: grid; grid-template-columns: max-content max-content; column-gap: 22px; row-gap: 6px; align-items: center;
  font-family: var(--f-math); font-size: clamp(1.1rem, 4.2vw, 1.55rem); width: max-content; line-height: 1.9; }
.rows .eq { white-space: nowrap; padding: 0 .3em; }
.rows .eq.cur { background: var(--pen-soft); box-shadow: inset 3px 0 0 var(--pen); }
.rows .eq.auto, .rows .nt.auto { color: var(--ink-soft); }
.rows .eq.fin { font-weight: 600; color: var(--green); }
.rows .nt { white-space: nowrap; color: var(--pen); font-size: .85em; }
.rows .nt.txt { font-family: var(--f-body); font-style: italic; font-size: .8rem; color: var(--ink-soft); }
.opbox { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); background: var(--paper); display: grid; gap: 10px; }
.opbox[hidden] { display: none; }
.opbox label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.tip { font-size: 13px; color: var(--ink-soft); margin: 0; }

.rule { background: var(--sheet); border: 1px solid var(--line); padding: 14px 18px; min-width: 0; }
.rule h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; }
.rule .big { font-family: var(--f-math); font-size: clamp(1.1rem, 4.2vw, 1.5rem); color: var(--pen); overflow-x: auto; white-space: nowrap; line-height: 2.2; }
.rule p { margin: 6px 0 0; color: var(--ink-soft); max-width: 66ch; }
.rule.locked .big { filter: blur(6px); user-select: none; }

.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 4px; color: var(--ink-soft); font-size: 13px; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 4px 0; }
.linkbtn.warn { color: var(--red); }
@media (prefers-reduced-motion: no-preference) { .topic, .btn, .key, .ts { transition: border-color .12s, box-shadow .12s, filter .12s, background-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Háromszöggyakorló</h1>
      <p>Szinusztétel és koszinusztétel: felírás gombokkal, megoldás lépésről lépésre.</p>
    </div>
    <div class="tally" aria-label="Összesítés">
      <div class="chip"><small>Sorozat</small><b id="tStreak">0</b></div>
      <div class="chip"><small>Hibátlan</small><b id="tTotal">0 / 0</b></div>
    </div>
  </header>

  <div class="layout">
    <nav class="topics" id="topics" aria-label="Feladattípusok"></nav>

    <section class="work">
      <div class="seg" role="radiogroup" aria-label="Nehézség" id="levels"><span>Nehézség</span></div>

      <article class="sheet" aria-labelledby="qKind">
        <p class="kind" id="qKind"></p>
        <p class="ask" id="qAsk"></p>

        <div class="task">
          <div class="fig"><svg id="fig" viewBox="0 0 380 260" role="img" aria-label="A háromszög ábrája"></svg></div>
          <div class="data">
            <h3>Adatok</h3>
            <ul id="dataList"></ul>
            <button class="btn sm" id="bThird" type="button" hidden></button>
          </div>
        </div>

        <!-- 1. lépés: a tétel felírása -->
        <div class="part" id="thmPart">
          <h2>1. lépés · A tétel felírása</h2>
          <div class="tabs" role="radiogroup" aria-label="Tétel" id="tabs">
            <button type="button" class="lv" data-k="sin" role="radio" aria-checked="false">Szinusztétel</button>
            <button type="button" class="lv" data-k="cos" role="radio" aria-checked="false">Koszinusztétel</button>
          </div>
          <div class="tpl" id="tpl"></div>
          <div class="grp" id="elGrp" hidden>
            <label>A tétel elemei: koppints egy helyre, majd egy elemre</label>
            <div class="keys" id="elKeys"></div>
          </div>
          <div class="actions" id="thmActions" hidden>
            <button class="btn primary" id="bThm" type="button">Tétel ellenőrzése</button>
            <button class="btn" id="bClr" type="button">Törlés</button>
          </div>
          <div class="fb" id="fbT" role="status" aria-live="polite"></div>
        </div>

        <!-- 2. lépés: az egyenlet megoldása -->
        <div class="part" id="solvePart" hidden>
          <h2>2. lépés · Az egyenlet megoldása</h2>
          <div class="scroll"><div class="rows" id="rows"></div></div>
          <div class="opbox" id="opBox">
            <label>Melyik műveletet végzed el mindkét oldalon?</label>
            <div class="keys" id="opKeys"></div>
            <div class="keys" id="operands"></div>
            <p class="tip" id="opTip"></p>
            <div class="keys" id="specKeys">
              <button type="button" class="key txt" data-s="compute">Kiszámolás</button>
              <button type="button" class="key txt" data-s="swap">Oldalcsere</button>
              <button type="button" class="key" data-s="sqrt">√</button>
              <button type="button" class="key" data-s="asin">sin⁻¹</button>
              <button type="button" class="key" data-s="acos">cos⁻¹</button>
            </div>
          </div>
          <div class="fb" id="fbS" role="status" aria-live="polite"></div>
        </div>

        <div class="actions">
          <button class="btn" id="bHint" type="button">Segítség</button>
          <button class="btn" id="bUndo" type="button" hidden>Visszalépés</button>
          <button class="btn" id="bReveal" type="button" hidden>Megoldás megmutatása</button>
          <button class="btn primary" id="bNext" type="button" hidden>Következő feladat</button>
        </div>
      </article>

      <aside class="rule" id="rule" aria-label="Módszer">
        <h2 id="ruleTitle"></h2>
        <div class="big" id="ruleBig"></div>
        <p id="ruleText"></p>
      </aside>

      <div class="foot">
        <span>A haladás ezen az eszközön, a böngészőben marad meg.</span>
        <button class="linkbtn" id="bReset" type="button">Eredmények törlése</button>
      </div>
    </section>
  </div>
</div>

<script>
/* ===== MOTOR: feladatgenerátorok, tételellenőrzés, egyenletek és átalakítások ===== */
// ENGINE START
const r = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[r(0, a.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = r(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const minus = s => String(s).replace(/-/g, '−');
const frac = (n, d) => '<span class="frac"><span>' + n + '</span><span>' + d + '</span></span>';
const RAD = Math.PI / 180;
const snap = x => { const k = Math.round(x); return Math.abs(x - k) < 1e-9 ? k : x; };
const near = (x, y) => Math.abs(x - y) < 1e-9 * Math.max(1, Math.abs(y));
const z0 = x => Math.abs(x) < 1e-9 ? 0 : x;
const sinD = d => snap(Math.sin(d * RAD));
const cosD = d => snap(Math.cos(d * RAD));
const asinD = v => snap(Math.asin(Math.max(-1, Math.min(1, v))) / RAD);
const acosD = v => snap(Math.acos(Math.max(-1, Math.min(1, v))) / RAD);
function fmtN(v, d = 4) {
  v = snap(v);
  if (Number.isInteger(v)) return minus(v);
  let s = v.toFixed(d);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return minus(s.replace('.', ','));
}
const isRound = (v, d) => Math.abs(v - Math.round(v * 10 ** d) / 10 ** d) < 1e-9;
const apx = (v, d) => (isRound(v, d) ? ' = ' : ' ≈ ') + fmtN(v, d);
const fmtDeg = v => fmtN(v, 2) + '°';
const UNIT = ' cm';

const SIDES = ['a', 'b', 'c'], ANGS = ['α', 'β', 'γ'], ORDER = ['a', 'b', 'c', 'α', 'β', 'γ'];
const OPP = { a: 'α', b: 'β', c: 'γ', α: 'a', β: 'b', γ: 'c' };
const isSide = k => SIDES.includes(k);
const isAng = k => ANGS.includes(k);
/* Tétel-elemek kulcsa: 'a','b','c' oldalak; 'sinα', 'cosβ' … szögfüggvények */
const trigAng = k => k.slice(3);
const elHtml = k => isSide(k) ? '<i>' + k + '</i>' : k.startsWith('sin') ? 'sin ' + trigAng(k) : k.startsWith('cos') ? 'cos ' + trigAng(k) : k;
const az = k => (k === 'a' || k === 'α') ? 'az' : 'a';
const Az = k => az(k)[0].toUpperCase() + az(k).slice(1);
const nameOf = k => isSide(k) ? az(k) + ' <i>' + k + '</i> oldal' : az(k) + ' ' + k + ' szög';

/* ===== Feladatgenerátorok (a, b, c, α, β, γ alapcímkékkel, utána véletlen átcímkézés) ===== */
const dec1 = (lo, hi) => r(Math.round(lo * 10), Math.round(hi * 10)) / 10;
const half = (lo, hi) => r(Math.round(lo * 2), Math.round(hi * 2)) / 2;
function anglesFromSides(a, b, c) {
  const al = acosD((b * b + c * c - a * a) / (2 * b * c)), be = acosD((a * a + c * c - b * b) / (2 * a * c));
  return { α: al, β: be, γ: snap(180 - al - be) };
}
const sideByCos = (b, c, al) => Math.sqrt(b * b + c * c - 2 * b * c * cosD(al));
/* [a, b, c, α]: egész oldalú háromszögek 60°, 90° vagy 120° szöggel (α az a-val szemközt) */
const NICE = [[7, 3, 8, 60], [7, 5, 8, 60], [13, 7, 15, 60], [13, 8, 15, 60], [19, 5, 21, 60], [19, 16, 21, 60], [14, 6, 16, 60], [14, 10, 16, 60],
  [7, 3, 5, 120], [13, 7, 8, 120], [19, 5, 16, 120], [14, 6, 10, 120], [5, 3, 4, 90], [10, 6, 8, 90], [13, 5, 12, 90], [17, 8, 15, 90]];

function genSinSide(L) {
  for (let i = 0; i < 1000; i++) {
    let al, be, a;
    if (L === 1) { al = 5 * r(6, 17); be = 5 * r(6, 17); a = r(4, 14); }
    else if (L === 2) { al = r(20, 100); be = r(20, 100); a = r(3, 20); }
    else { al = Math.random() < 0.5 ? half(20, 100) : r(20, 100); be = Math.random() < 0.5 ? half(20, 100) : r(20, 100); a = dec1(2, 25); }
    const ga = 180 - al - be;
    if (ga < (L === 1 ? 30 : 15)) continue;
    const S = { a, b: a * sinD(be) / sinD(al), c: a * sinD(ga) / sinD(al) };
    if (S.b < 1.5 || S.c < 1.5 || S.b > 40 || S.c > 40) continue;
    const third = L >= 2 && Math.random() < 0.5;   // a szemközti szöget a szögösszegből kell kiszámolni
    return { S, G: { α: al, β: be, γ: ga }, given: third ? { a, β: be, γ: ga } : { a, α: al, β: be }, target: 'b' };
  }
}
function genSinAng(L) {
  for (let i = 0; i < 1000; i++) {
    let al, a, b;
    if (L === 1) { al = pick([30, 45, 60, 90, 120, 135, 150]); a = r(6, 15); b = r(3, a - 1); }
    else if (L === 2) { al = r(25, 140); a = r(5, 20); b = r(2, a - 1); }
    else { al = Math.random() < 0.5 ? half(25, 140) : r(25, 140); a = dec1(4, 22); b = dec1(2, a - 0.5); }
    if (b >= a) continue;                            // a nagyobb oldallal szemközti szög ismert → egyértelmű
    const be = asinD(b * sinD(al) / a), ga = 180 - al - be;

function drawFig() {
  const S = cur.S, G = cur.G, W = 380, H = 260, pad = 46;
  const P = { A: [0, 0], B: [S.c, 0], C: [S.b * cosD(G.α), S.b * sinD(G.α)] };
  const xs = Object.values(P).map(p => p[0]), ys = Object.values(P).map(p => p[1]);
  const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
  const sc = Math.min((W - 2 * pad) / (mxx - mnx), (H - 2 * pad) / (mxy - mny));
  const ox = (W - (mxx - mnx) * sc) / 2, oy = (H - (mxy - mny) * sc) / 2;
  const Q = {}; for (const k in P) Q[k] = [ox + (P[k][0] - mnx) * sc, H - oy - (P[k][1] - mny) * sc];
  const cen = [(Q.A[0] + Q.B[0] + Q.C[0]) / 3, (Q.A[1] + Q.B[1] + Q.C[1]) / 3];
  const V = { α: 'A', β: 'B', γ: 'C' }, SE = { a: ['B', 'C'], b: ['A', 'C'], c: ['A', 'B'] };
  const unit = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const status = k => st.found && k === cur.target ? 'calc' : k === cur.target ? 'target' : k in cur.given ? 'given' : k in st.known ? 'calc' : (st.finished ? 'calc' : 'other');
  const label = k => {
    const s = status(k), nm = isSide(k) ? '<tspan font-style="italic">' + k + '</tspan>' : k;
    const v = valOf(cur, k);
    if (s === 'target') return nm + ' = ?';
    if (s === 'other') return nm;
    const d = k in cur.given ? 2 : isSide(k) ? 2 : 1;
    return nm + apx(v, d) + (isSide(k) ? '' : '°');
  };
  let out = '<polygon class="tri" points="' + [Q.A, Q.B, Q.C].map(p => p.join(',')).join(' ') + '"/>';
  // kiemelt oldalak
  for (const k of SIDES) {
    const s = status(k); if (s === 'other') continue;
    const [p, q] = SE[k].map(n => Q[n]);
    out += '<line class="sd s-' + s + '" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"/>';
  }
  // szögívek és feliratok
  for (const g of ANGS) {
    const v = Q[V[g]], others = ['A', 'B', 'C'].filter(n => n !== V[g]).map(n => Q[n]);
    const u1 = unit(v, others[0]), u2 = unit(v, others[1]);
    const len = Math.min(Math.hypot(others[0][0] - v[0], others[0][1] - v[1]), Math.hypot(others[1][0] - v[0], others[1][1] - v[1]));
    const rr = Math.min(24, len * 0.3), s = status(g);
    const cross = u1[0] * u2[1] - u1[1] * u2[0];
    if (Math.abs(G[g] - 90) < 1e-6) {
      const d = rr * 0.7, c1 = [v[0] + u1[0] * d, v[1] + u1[1] * d], c2 = [v[0] + u2[0] * d, v[1] + u2[1] * d], c3 = [c1[0] + u2[0] * d, c1[1] + u2[1] * d];
      out += '<path class="arc s-' + s + '" style="fill:none" d="M' + c1 + ' L' + c3 + ' L' + c2 + '"/>';
    } else {
      out += '<path class="arc s-' + s + '" style="fill:none" d="M' + (v[0] + u1[0] * rr) + ',' + (v[1] + u1[1] * rr) +
        ' A' + rr + ',' + rr + ' 0 0 ' + (cross > 0 ? 1 : 0) + ' ' + (v[0] + u2[0] * rr) + ',' + (v[1] + u2[1] * rr) + '"/>';
    }
    let bx = u1[0] + u2[0], by = u1[1] + u2[1]; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
    const dist = Math.min(78, Math.max(rr + 20, 20 / Math.sin(G[g] * RAD / 2)));
    const tx = v[0] + bx * dist, ty = v[1] + by * dist;
    out += '<text class="lb halo s-' + s + '" x="' + tx + '" y="' + ty + '" text-anchor="middle" dominant-baseline="middle">' + label(g) + '</text>';
  }
  // oldalfeliratok kívül
  for (const k of SIDES) {
    const [p, q] = SE[k].map(n => Q[n]), m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let nx = -(q[1] - p[1]), ny = q[0] - p[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if ((m[0] - cen[0]) * nx + (m[1] - cen[1]) * ny < 0) { nx = -nx; ny = -ny; }
    const tx = m[0] + nx * 14, ty = m[1] + ny * 14;
    const anchor = nx > 0.35 ? 'start' : nx < -0.35 ? 'end' : 'middle';
    out += '<text class="lb halo s-' + status(k) + '" x="' + tx + '" y="' + ty + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + label(k) + '</text>';
  }
  // csúcsok
  for (const n of ['A', 'B', 'C']) {
    const u = unit(cen, Q[n]);
    out += '<text class="vx" x="' + (Q[n][0] + u[0] * 15) + '" y="' + (Q[n][1] + u[1] * 15) + '" text-anchor="middle" dominant-baseline="middle">' + n + '</text>';
  }
  $('fig').innerHTML = out;
}

function operandList() {

    for (const s of [E.L, E.R]) if (!near(s.c, 1)) add(fmtN(s.c), { num: s.c });
    return out.map(o => ({ html: o.html, op: Object.assign({ k: k === '·' ? 'mul' : 'div' }, o.op) }));
  }

    : 'Javasolt lépés: mindkét oldalon <span class="m">' + n.h.replace('| ', '') + '</span>');
}

/* ---------- Új feladat ---------- */
function newTask() {
  cur = makeTask(state.topic, state.level, prevKey);
  prevKey = cur.key;
  st = { phase: 'thm', known: Object.assign({}, cur.given), third: null, thm: { kind: null, slots: [], active: 0 },
    E: null, rows: [], hist: [], errors: 0, rejects: 0, hintShown: false, hintLevel: 0, finished: false, found: null, selOp: null, opList: [] };
  const t = TOPICS.find(x => x.id === cur.topic);
  $('qKind').textContent = state.topic === 'mixed' ? 'Vegyes feladat' : t.kind;
  const tg = cur.target;
  $('qAsk').innerHTML = 'Számold ki ' + nameOf(tg) + (isSide(tg) ? ' hosszát' : ' nagyságát') + '! Írd fel a megfelelő tételt a gombokkal, aztán oldd meg az egyenletet.';
  $('solvePart').hidden = true;
  $('bHint').hidden = false; $('bReveal').hidden = true; $('bNext').hidden = true; $('bUndo').hidden = true;
  clearFb();
  if (state.topic !== 'mixed') st.thm = { kind: t.thm, slots: Array(t.thm === 'sin' ? 4 : 6).fill(null), active: 0 };
  renderTabs(); renderTpl(); renderData(); drawFig(); renderRule();
}

/* ---------- Események ---------- */
$('topics').addEventListener('click', e => {
  const b = e.target.closest('.topic'); if (!b) return;
  state.topic = b.dataset.id; save(); renderTopics(); newTask();
});
$('levels').addEventListener('click', e => {
  const b = e.target.closest('.lv'); if (!b) return;
  state.level = Number(b.dataset.id); save(); renderLevels(); newTask();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b) chooseThm(b.dataset.k); });
$('tpl').addEventListener('click', e => {
  const b = e.target.closest('.ts'); if (!b || st.phase !== 'thm') return;
  st.thm.active = Number(b.dataset.i); renderTpl();
});
$('elKeys').addEventListener('click', e => { const b = e.target.closest('.key'); if (b) putEl(b.dataset.k); });
$('bThm').addEventListener('click', checkThm);
$('bClr').addEventListener('click', () => { if (st.thm.kind) chooseThm(st.thm.kind); });
$('bThird').addEventListener('click', doThird);
$('opKeys').addEventListener('click', e => {
  const b = e.target.closest('.key'); if (!b) return;
  st.selOp = st.selOp === b.dataset.o ? null : b.dataset.o; renderSolve();
});
$('operands').addEventListener('click', e => {
  const b = e.target.closest('.key'); if (!b) return;
  const o = st.opList[Number(b.dataset.i)]; if (o) userOp(o.op);
});
$('specKeys').addEventListener('click', e => { const b = e.target.closest('.key'); if (b) userOp({ k: b.dataset.s }); });
$('bHint').addEventListener('click', hint);
$('bUndo').addEventListener('click', undo);
$('bReveal').addEventListener('click', reveal);
$('bNext').addEventListener('click', newTask);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && st && st.finished && document.activeElement !== $('bNext')) { e.preventDefault(); newTask(); }
});
let resetArmed = false, resetTimer = null;
$('bReset').addEventListener('click', () => {
  const b = $('bReset');
  if (!resetArmed) {
    resetArmed = true; b.textContent = 'Biztosan törlöd? Kattints még egyszer.'; b.classList.add('warn');
    resetTimer = setTimeout(() => { resetArmed = false; b.textContent = 'Eredmények törlése'; b.classList.remove('warn'); }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; b.textContent = 'Eredmények törlése'; b.classList.remove('warn');
  state.stats = {}; state.streak = 0; save(); renderTopics(); renderTally();
});

load(); renderTopics(); renderLevels(); renderTally(); newTask();
</script>
</body></html>
